<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras Básico</title>
    <link rel="stylesheet" href="/Css/carrito.css"> 
</head>
<body>
    <div class="cart-container">
        <h1>🛒 Tu Carrito de Compras</h1>
        
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Total</th>
                    <th>Acción</th>
                </tr>

            </thead>
            <tbody>
                <tr class="cart-item">
                    <td>Laptop Gamer X1</td>
                    <td class="price">$1200.00</td>
                    <td><input type="number" value="1" min="1" class="quantity-input"></td>
                    <td class="item-total">$1200.00</td>
                    <td><button class="remove-btn">Eliminar</button></td>
                </tr>
                
                <tr class="cart-item">
                    <td>Mouse Ergonómico Z</td>
                    <td class="price">$25.00</td>
                    <td><input type="number" value="2" min="1" class="quantity-input"></td>
                    <td class="item-total">$50.00</td>
                    <td><button class="remove-btn">Eliminar</button></td>
                </tr>
            </tbody>
        </table>
        
        <div class="cart-summary">
            <p>Subtotal: <span id="subtotal">$1250.00</span></p>
            <p>Envío: <span id="shipping">$10.00</span></p>
            <h3>Total a Pagar: <span id="grand-total">$1260.00</span></h3>

            <button class="checkout-btn">Finalizar Compra</button>
        </div>
    </div>
</body>
</html>
