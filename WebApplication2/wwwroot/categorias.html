<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Categorías - PetStore</title>
  <link rel="stylesheet" href="Css/categorias.css">
</head>
<body>
    <header class="navbar">
        <h1 class="logo">🐾 El Norteño Store</h1>
        <nav>
            <a href="index.html">Inicio</a>
        </nav>
    </header>

    <section class="categorias">
        <h2>Categorías</h2>
        <div class="categorias-contenedor">
            <div class="categoria">
                <a href="Catalogo.html?categoria=Perro"><img src="Imagenes/Perro.jpg" alt="Perros"></a>
                <h3>Perros</h3>
            </div>

            <div class="categoria">
                <a href="Catalogo.html?categoria=Gato"><img src="Imagenes/gatito.jpg" alt="Gatos"></a>
                <h3>Gatos</h3>
            </div>

            <div class="categoria">
                <a href="Catalogo.html?categoria=Conejo"><img src="Imagenes/Conejo.png" alt="Conejos"></a>
                <h3>Conejos</h3>
            </div>

            <div class="categoria">
                <a href="Catalogo.html?categoria=Hamsters"><img src="Imagenes/hamster.jpg" alt="Hamsters"></a>
                <h3>Hamsters</h3>
            </div>

            <div class="categoria">
                <a href="Catalogo.html?categoria=Ave"><img src="Imagenes/aves.jpg" alt="Aves"></a>
                <h3>Aves</h3>
            </div>

        </div>
    </section>

    <!-- Carrito Flotante -->
    <div class="carrito-flotante">
        <button class="btn-carrito-flotante" onclick="toggleCarrito()">
            🛒
            <span class="contador-carrito" id="contadorCarrito">0</span>
        </button>
    </div>

    <script src="Js/Carrito.js"></script>

    <!-- Modal del Carrito -->
    <div class="modal-overlay" id="modalOverlay" onclick="cerrarCarrito()"></div>

    <div class="modal-carrito" id="modalCarrito">
        <div class="carrito-header">
            <h2>🛒 Tu Carrito</h2>
            <button class="btn-cerrar-carrito" onclick="cerrarCarrito()">×</button>
        </div>

        <div class="carrito-content" id="carritoContent">
            <!-- Los productos del carrito se cargan aquí -->
        </div>

        <div class="carrito-footer">
            <div class="desglose-item">
                <span>Subtotal:</span>
                <span class="subtotal-precio" id="subtotalPrecio">$0.00 MXN</span>
            </div>
            <div class="desglose-item">
                <span>IVA (16%):</span>
                <span class="iva-precio" id="ivaPrecio">$0.00 MXN</span>
            </div>
            <div class="carrito-total">
                <span>Total:</span>
                <span class="total-precio" id="totalPrecio">$0.00</span>
            </div>
            <button class="btn-comprar" id="btnComprar" onclick="procesarCompra()">
                Finalizar Compra
            </button>
        </div>
    </div>

    <footer>
        <p>© 2025 PetStore - Todos los derechos reservados 🐶</p>
    </footer>
</body>
</html>
